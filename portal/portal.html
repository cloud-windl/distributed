<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Login</h2>

<form method="post" action="/login">
    <div>
        <label>Username:</label>
        <input type="text" name="username">
    </div>

    <div>
        <label>Password:</label>
        <input type="password" name="password">
    </div>

    <div style="margin-top:10px;">
        <button type="submit">Login</button>
    </div>
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{.title}}</title>
</head>
<body>
<h1>{{.title}}</h1>

<form method="post" action="{{.action}}">
    <div>
        <label>Title:</label>
        <input type="text" name="title" value="{{.grade.Title}}">
    </div>

    <div style="margin-top: 10px;">
        <label>Type:</label>
        <input type="text" name="type" value="{{.grade.Type}}">
    </div>

    <div style="margin-top: 10px;">
        <label>Score:</label>
        <input type="text" name="score" value="{{.grade.Score}}">
    </div>

    <div style="margin-top: 15px;">
        <button type="submit">{{.submitText}}</button>
        <a href="/students/{{.studentID}}" style="margin-left: 10px;">Back</a>
    </div>
</form>
</body>
</html>
